<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0e14"><title>GoalForge — Private workspace</title><style>.landing{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0c0e14;color:#eef0f7;font-family:system-ui,sans-serif}.landing-card{width:min(440px,100%);box-sizing:border-box;padding:36px;border:1px solid #282b37;border-radius:18px;background:#13151e;box-shadow:0 24px 70px #0007}.landing-card h1{font-size:28px;margin:0 0 8px}.landing-card p{color:#a4a8b8;font-size:14px;line-height:1.6}.landing-card label{display:block;margin:24px 0 8px;color:#c7cad6}.landing-card input{width:100%;box-sizing:border-box;background:#0c0e14;color:white;border:1px solid #383b49;border-radius:8px;padding:12px;font-size:15px}.landing-card button{width:100%;margin-top:14px;border:0;border-radius:8px;background:#7163e8;color:white;padding:12px;font-weight:700;cursor:pointer}.landing-error{color:#ff9da4!important;min-height:1.5em}</style><script src="/static/login.js" defer></script></head><body><main class="landing"><section class="landing-card"><h1>GoalForge</h1><p>Your goals workspace is private. Sign in as the owner to access goals, activity, tasks, lessons, settings, and execution.</p><form id="login-form"><label for="owner-password">Owner password</label><input id="owner-password" type="password" autocomplete="current-password" required maxlength="256"><button type="submit">Sign in</button><p id="login-error" class="landing-error" role="alert"></p></form><p id="auth-config-status">Checking owner authentication status…</p></section></main></body></html>
